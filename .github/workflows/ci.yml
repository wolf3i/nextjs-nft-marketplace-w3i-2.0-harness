name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Jobname ist der Name des Required Status Check in der Branch Protection.
  # Er heißt bewusst wie die lokale Prüfkette (`npm run check`), damit lokal
  # und in der CI dieselbe Kette denselben Namen trägt. Nicht umbenennen,
  # ohne das Ruleset für `main` mit umzustellen.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deckt Lint, Typecheck, Doku-, Regel-, Vertrags- und Secret-Gate sowie
      # die Tests ab — dieselbe Kette wie lokal.
      - name: Check (lint, typecheck, gates, tests)
        run: npm run check

      # Version gepinnt statt `latest`: ein neuer Regelsatz upstream darf die
      # CI nicht ohne Commit im Repo rot färben. `--no-git` scannt den
      # Arbeitsbaum (gitignorierte Pfade wie node_modules bleiben außen vor),
      # bewusst kein Historien-Scan — siehe docs/adr/0001-kein-historien-scan.md.
      # `--redact` verhindert, dass ein Treffer im öffentlichen CI-Log steht.
      - name: Secret scan (gitleaks)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.30.1
          detect --source /repo --no-git --redact --verbose

      # Läuft die Tests ein zweites Mal, nur um das Coverage-Artefakt zu
      # erzeugen. Bewusst in Kauf genommen (rund 1,2 s), statt lokal und in
      # der CI unterschiedliche Ketten zu fahren.
      - name: Tests (coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build
